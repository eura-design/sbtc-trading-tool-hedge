<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월별 수익 결산</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; justify-content: center; padding: calc(48px + 2rem) 1rem 2rem; }
  .container { width: 100%; max-width: 680px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 1.5rem; color: #222; }
  nav { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #fff; border-bottom: 0.5px solid #e0e0e0; z-index: 100; display: flex; justify-content: center; }
  .nav-inner { width: 100%; max-width: 680px; padding: 0 1rem; display: flex; align-items: center; }
  .nav-logo { font-size: 14px; font-weight: 600; color: #222; margin-right: auto; letter-spacing: -0.2px; }
  .nav-tab { font-size: 13px; color: #999; padding: 0 14px; height: 48px; display: flex; align-items: center; text-decoration: none; border-bottom: 2px solid transparent; transition: color 0.15s; white-space: nowrap; }
  .nav-tab:hover { color: #333; }
  .nav-tab.active { color: #1D9E75; border-bottom-color: #1D9E75; font-weight: 500; }

  .card { background: #fff; border-radius: 12px; border: 0.5px solid #e0e0e0; padding: 1.25rem; margin-bottom: 1rem; }

  /* 시드머니 */
  .seed-row { display: flex; align-items: center; gap: 14px; }
  .seed-row label { font-size: 14px; color: #666; white-space: nowrap; }
  .seed-prefix { font-size: 18px; color: #888; font-weight: 500; }
  .seed-row input[type=number] { flex: 1; font-size: 20px; font-weight: 500; color: #222; border: none; border-bottom: 1.5px solid #e0e0e0; outline: none; background: transparent; text-align: right; padding: 2px 4px; min-width: 0; }
  .seed-row input[type=number]:focus { border-bottom-color: #1D9E75; }
  .seed-row input[type=number]::-webkit-inner-spin-button,
  .seed-row input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* 요약 */
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
  .metric { background: #f5f5f3; border-radius: 8px; padding: 0.9rem; text-align: center; }
  .metric .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .metric .value { font-size: 20px; font-weight: 500; color: #222; }
  .metric .value.green { color: #1D9E75; }
  .metric .value.red { color: #E05252; }

  /* 결산 입력 */
  .entry-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #888; }
  .field input { font-size: 15px; color: #222; border: 1px solid #e0e0e0; border-radius: 6px; padding: 6px 10px; outline: none; width: 100%; }
  .field input:focus { border-color: #1D9E75; }
  .field input::-webkit-inner-spin-button,
  .field input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .field-month { flex: 2; min-width: 100px; }
  .field-asset { flex: 3; min-width: 120px; }
  /* 입금(초록)과 출금(빨강)을 테두리 색으로 가른다 — 둘을 바꿔 넣으면
     수익이 두 배로 어긋나므로 입력할 때 눈으로 구분돼야 한다 */
  .field-deposit { flex: 2; min-width: 100px; }
  .field-deposit input { border-color: #d8ece4; }
  .field-deposit input:focus { border-color: #1D9E75; }
  .field-withdraw { flex: 2; min-width: 100px; }
  .field-withdraw input { border-color: #f0e0e0; }
  .field-withdraw input:focus { border-color: #E05252; }
  /* 자동이 넣은 줄 표시 — 손으로 넣은 줄과 구분돼야 "내가 고친 값인가"를 알 수 있다 */
  .auto-tag { font-size: 10px; color: #1D9E75; background: #eaf6f1; border-radius: 4px;
              padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  .btn-add { background: #1D9E75; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; align-self: flex-end; height: 36px; }
  .btn-add:hover { background: #178c65; }

  /* 차트 */
  .chart-wrap { display: flex; align-items: flex-end; gap: 4px; height: 160px; margin-bottom: 1.5rem; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; min-width: 0; }
  .bar-col .bar-val { font-size: 9px; color: #1D9E75; font-weight: 500; text-align: center; word-break: break-all; }
  .bar-col .bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.2s; }
  .bar-col .bar.pos { background: #5DCAA5; }
  .bar-col .bar.neg { background: #E05252; border-radius: 0 0 3px 3px; }
  .bar-col .bar-label { font-size: 10px; color: #888; text-align: center; word-break: break-all; }

  /* 테이블 */
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid #e0e0e0; }
  th { padding: 8px; font-weight: 500; color: #888; text-align: right; }
  th:first-child { text-align: center; }
  th:last-child { text-align: center; width: 40px; }
  td { padding: 7px 8px; border-bottom: 0.5px solid #f0f0f0; text-align: right; }
  td:first-child { text-align: center; color: #666; }
  td:last-child { text-align: center; }
  tr:nth-child(even) { background: #fafaf8; }
  .profit { color: #1D9E75; font-weight: 500; }
  .loss { color: #E05252; font-weight: 500; }
  .cumrate.pos { color: #1D9E75; }
  .cumrate.neg { color: #E05252; }
  .btn-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; line-height: 1; }
  .btn-del:hover { color: #E05252; }

  .empty { text-align: center; color: #bbb; padding: 2rem 0; font-size: 14px; }
  .note { font-size: 12px; color: #999; margin-top: 1rem; line-height: 1.6; }

  /* 저장 상태 */
  .save-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #999; margin-bottom: 1rem; min-height: 16px; }
  .save-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; flex: none; }
  .save-status.ok   .dot { background: #1D9E75; }
  .save-status.ok   { color: #1D9E75; }
  .save-status.warn .dot { background: #E0A020; }
  .save-status.warn { color: #C08010; }
  .save-status.err  .dot { background: #E05252; }
  .save-status.err  { color: #E05252; }
  .btn-retry { background: none; border: 1px solid currentColor; color: inherit; border-radius: 5px;
               padding: 2px 8px; font-size: 11px; cursor: pointer; flex: none; }
  .btn-retry:hover { background: rgba(0,0,0,0.04); }

  /* 저장할 수 없는 동안에는 입력이 잠긴 게 보여야 한다 — 눌리는데 아무 일도 안 하면 고장으로 읽힌다 */
  input:disabled { background: #f2f2f0; color: #bbb; cursor: not-allowed; }
  .btn-add:disabled { background: #d5d5d2; cursor: not-allowed; }
  .btn-add:disabled:hover { background: #d5d5d2; }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <span class="nav-logo">수익률 트래커</span>
    <a class="nav-tab" href="compound_calculator.html">복리 계산기</a>
    <a class="nav-tab active" href="monthly_tracker.html">월별 결산</a>
  </div>
</nav>
<div class="container">
  <h1>월별 수익 결산</h1>

  <div class="save-status" id="saveStatus" style="display:none"><span class="dot"></span><span id="saveStatusText">저장 위치 확인 중...</span><button class="btn-retry" id="btnRetry" style="display:none">다시 시도</button></div>

  <!-- 시드머니 -->
  <div class="card">
    <div class="seed-row">
      <label>첫 시드머니</label>
      <span class="seed-prefix">$</span>
      <input type="number" id="seedInput" value="3000" min="1" placeholder="3000">
    </div>
  </div>

  <!-- 요약 -->
  <div class="summary">
    <div class="metric">
      <div class="label">투입 원금</div>
      <div class="value" id="sumPrincipal">$3,000</div>
    </div>
    <div class="metric">
      <div class="label">현재 잔고</div>
      <div class="value" id="sumAsset">$3,000</div>
    </div>
    <div class="metric">
      <div class="label">총 입금</div>
      <div class="value" id="sumDeposit">$0</div>
    </div>
    <div class="metric">
      <div class="label">총 출금</div>
      <div class="value" id="sumWithdraw">$0</div>
    </div>
    <div class="metric">
      <div class="label">누적 수익률</div>
      <div class="value" id="sumRate">0.0%</div>
    </div>
    <div class="metric">
      <div class="label">누적 수익금</div>
      <div class="value" id="sumProfit">$0</div>
    </div>
  </div>

  <!-- 결산 입력 — 결산은 백엔드가 자동으로 채운다(services/trackerAuto.js).
       이 폼이 남아 있는 이유는 하나다: 자동 줄을 `×`로 지우면 그 달이 `autoSkip`에 들어가
       다시 채워지지 않는데, 그때 **내가 정한 값으로 넣을 길**이 있어야 한다.
       ⚠ 2026-09-26에 `<details>` 접이식으로 바꿨다가 **같은 날 되돌렸다** — 사용자가
         "접이식하니까 더 이상해"라고 했다. 다시 접지 말 것 -->
  <div class="card">
    <div class="entry-form">
      <div class="field field-month">
        <label>월 (예: 2025-01)</label>
        <input type="text" id="inMonth" placeholder="2025-01" maxlength="10">
      </div>
      <div class="field field-asset">
        <label>월말 잔고 ($)</label>
        <input type="number" id="inAsset" placeholder="3000" step="any" min="0">
      </div>
      <div class="field field-deposit">
        <label>이번달 입금 ($)</label>
        <input type="number" id="inDeposit" placeholder="0 (선택)" step="any" min="0">
      </div>
      <div class="field field-withdraw">
        <label>이번달 출금 ($)</label>
        <input type="number" id="inWithdraw" placeholder="0 (선택)" step="any" min="0">
      </div>
      <button class="btn-add" id="btnAdd" onclick="addEntry()">+ 추가</button>
    </div>
  </div>

  <!-- 차트 + 테이블 -->
  <div class="card" id="resultsCard" style="display:none">
    <div class="chart-wrap" id="chart"></div>
    <table>
      <thead>
        <tr id="tableHead">
          <th>월</th>
          <th>이번달 수익</th>
          <th>잔고</th>
          <!-- ⚠ 입금·출금 열은 한 건이라도 있을 때만 보인다. 그 토글이 예전에
               `th:nth-child(4)`로 자리를 세고 있었는데, 열이 하나 늘면 어긋난다.
               그래서 id로 집는다 (2026-09-26, 입금 열을 더하면서) -->
          <th id="thDeposit">입금</th>
          <th id="thWithdraw">출금</th>
          <th>이번달 수익률</th>
          <th>누적 수익률</th>
          <th>누적 수익금</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p class="note">* 세금, 수수료, 펀딩비 미반영. 실제 수익은 다를 수 있습니다.</p>
  </div>
  <div class="card" id="emptyCard">
    <div class="empty">아직 결산 내역이 없습니다.<br>위에서 월말 잔고를 입력해 주세요.</div>
  </div>
</div>

<script>
  // entries: [{ month: "2025-01", asset: 3200, deposit: 0, withdrawal: 0 }, ...] — 월말 잔고 저장
  //   deposit    = 그 달에 **외부에서 가져와 넣은 돈**. 거래로 번 돈이 아니므로 수익에서 뺀다
  //   withdrawal = 그 달에 빼낸 돈. 번 돈이므로 수익에 더한다
  //   ⚠ 2026-09-26 이전 기록에는 `deposit`이 없다 — 읽는 쪽이 전부 `|| 0`으로 받는다.
  //     그래서 옛 기록의 숫자는 하나도 바뀌지 않는다 (이사 작업 없음)
  //
  // ── 저장 위치 ──────────────────────────────────────────────────────────────
  // **기타/tracker_data.json 하나가 원본이다.** 백엔드(3002)가 그 파일을 읽고 쓴다.
  //   ⚠ localStorage에 사본을 두지 말 것 (2026-08-22 사용자 확정으로 제거).
  //     원본이 둘이 되면 백엔드가 꺼진 채로 입력한 달이 생기고, 다시 켤 때
  //     "파일이 원본"이라는 규칙에 따라 **그 달이 조용히 사라진다**
  //     (파일엔 아직 없는 게 당연한데, 없다는 이유로 버려진다).
  //     합치려면 같은 달이 양쪽에 다를 때 무엇이 맞는지 물어야 하는데
  //     이 페이지 규모에 그 UI는 과하다. 그래서 **저장할 수 없으면 입력을 막는다** —
  //     어디에도 안 남을 값을 받아두는 것보다 낫다
  const API = 'http://localhost:3002/api/tracker';

  // 구버전(파일 저장 이전) 브라우저 키 — **일회성 이관 용도로만** 읽는다
  const LEGACY_ENTRIES = 'monthly_entries_v2';
  const LEGACY_SEED    = 'monthly_seed_v2';

  let entries = [];
  // 자동이 넣었다가 **내가 지운 달**. 이게 없으면 다음 자동 실행(1시간마다)이 그 줄을
  // 되살려서 지울 방법이 없어진다 (backend/utils/trackerMonths.js의 mergeAuto 참고)
  let autoSkip = [];
  let seed = 3000;
  let ready = false;      // 파일을 읽어냈나. false면 입력 차단
  let saveTimer = null;

  const $ = (id) => document.getElementById(id);
  // ⚠ 입력칸을 새로 만들면 **여기에도 넣을 것** — 빠지면 저장할 수 없는 상태(백엔드 꺼짐)에서
  //   그 칸만 입력이 되어, 적어 놓고 저장은 안 되는 상황이 된다.
  //   실제로 `inDeposit`을 2026-09-26에 추가할 때 빠뜨렸다
  const INPUTS = ['seedInput', 'inMonth', 'inAsset', 'inDeposit', 'inWithdraw'];

  // ⚠ **잘 됐을 때는 아무것도 띄우지 않는다** (2026-09-26 사용자 요청).
  //   결산이 자동으로 채워지므로 "불러옴 (7개월)" 같은 줄은 알려줄 것이 없다.
  //   ⚠ 그래도 `warn`·`err`는 반드시 남긴다 — 백엔드가 꺼지면 표가 비는데, 그때
  //     아무 문구도 없으면 **"기록이 없다"로 오해한다.** 그 경우만 한 줄 뜬다
  function setStatus(kind, text, showRetry) {
    const show = kind === 'warn' || kind === 'err';
    const el = $('saveStatus');
    el.className = 'save-status' + (kind ? ' ' + kind : '');
    el.style.display = show ? '' : 'none';
    $('saveStatusText').textContent = show ? text : '';
    $('btnRetry').style.display = (show && showRetry) ? '' : 'none';
  }

  // 저장할 수 없는 상태에서는 입력 자체를 막는다 (위 주석 참고)
  function setEnabled(on) {
    INPUTS.forEach(id => { $(id).disabled = !on; });
    $('btnAdd').disabled = !on;
  }

  function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
  function fmtDec(n) { return n.toLocaleString('ko-KR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

  function getSeed() {
    const v = parseFloat($('seedInput').value);
    return (isFinite(v) && v > 0) ? v : 1;
  }

  function nextMonth() {
    if (entries.length === 0) {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }
    const last = entries[entries.length - 1].month;
    const [y, m] = last.split('-').map(Number);
    const next = new Date(y, m);
    return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
  }

  function refreshMonthInput() { $('inMonth').value = nextMonth(); }

  function addEntry() {
    if (!ready) return;
    const month = $('inMonth').value.trim();
    const assetRaw = parseFloat($('inAsset').value);
    const depositRaw = parseFloat($('inDeposit').value) || 0;
    const withdrawRaw = parseFloat($('inWithdraw').value) || 0;

    if (!month) { alert('월을 입력해 주세요.'); return; }
    if (!isFinite(assetRaw) || assetRaw < 0) { alert('월말 잔고를 입력해 주세요.'); return; }
    if (depositRaw < 0) { alert('입금은 0 이상이어야 합니다.'); return; }
    if (entries.some(e => e.month === month)) { alert('이미 해당 월의 결산이 있습니다.'); return; }

    entries.push({ month, asset: assetRaw, deposit: depositRaw, withdrawal: withdrawRaw });
    // ⚠ 달 순서로 다시 맞춘다 (2026-09-27). 수익은 바로 윗줄의 월말 잔고와 비교해 계산하므로,
    //   앞선 달을 뒤늦게 넣었을 때 맨 끝에 붙으면 그 줄과 다음 줄의 수익이 틀린다.
    //   서버도 저장할 때 정렬하지만(`routes/tracker.js`), 이 화면은 저장 응답을 기다리지 않고
    //   바로 그리므로 여기서도 맞춰야 한다
    entries.sort((a, b) => a.month.localeCompare(b.month));
    save();
    render();
    $('inAsset').value = '';
    $('inDeposit').value = '';
    $('inWithdraw').value = '';
    refreshMonthInput();
  }

  function deleteEntry(idx) {
    if (!ready) return;
    const gone = entries[idx];
    // 자동이 넣은 줄을 지웠으면 **다시 채우지 말라고 적어 둔다.**
    // 손으로 넣은 줄은 자동이 애초에 손대지 않으므로 적을 필요가 없다
    if (gone?.auto === true && !autoSkip.includes(gone.month)) autoSkip.push(gone.month);
    entries.splice(idx, 1);
    save();
    render();
    refreshMonthInput();
  }

  // ── 저장 ───────────────────────────────────────────────────────────────────
  function save() {
    if (!ready) return;
    seed = getSeed();
    // 시드머니는 키 입력마다 호출되므로(input 이벤트) 한 박자 모아서 보낸다
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushToServer, 300);
  }

  async function pushToServer() {
    saveTimer = null;
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seed, entries, autoSkip }),
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.error || res.status);
      }
      setStatus('ok', '기타/tracker_data.json에 저장됨');
      return true;
    } catch (e) {
      // ⚠ 조용히 넘어가지 말 것 — 원본이 하나뿐이라 실패하면 그 값은 어디에도 없다
      setStatus('err', '저장 실패 (' + e.message + ') — 이 값은 아직 파일에 없습니다', true);
      return false;
    }
  }

  // ⚠ debounce 대기 중에 창을 닫으면 마지막 입력이 파일에 안 들어간다.
  //   sendBeacon은 언로드 중에도 나간다 (fetch는 취소된다)
  window.addEventListener('pagehide', () => {
    if (!ready || saveTimer === null) return;
    clearTimeout(saveTimer);
    try {
      navigator.sendBeacon(API, new Blob([JSON.stringify({ seed, entries })],
        { type: 'application/json' }));
    } catch {}
  });

  // ── 초기 로드 ──────────────────────────────────────────────────────────────
  // 구버전 브라우저 저장분을 **한 번만** 파일로 옮긴다. 옮긴 뒤 키를 지워서
  // 다음부터는 localStorage를 아예 읽지 않는다 (원본이 둘이 되지 않게)
  async function migrateLegacy() {
    let old;
    try { old = JSON.parse(localStorage.getItem(LEGACY_ENTRIES) || '[]'); } catch (e) { return false; }
    if (!Array.isArray(old) || old.length === 0) return false;

    const oldSeed = parseFloat(localStorage.getItem(LEGACY_SEED));
    entries = old;
    seed = (isFinite(oldSeed) && oldSeed > 0) ? oldSeed : 3000;
    $('seedInput').value = seed;

    // ⚠ 저장에 성공했을 때만 옛 키를 지운다 — 실패했는데 지우면 그게 유실이다
    if (!await pushToServer()) return false;
    localStorage.removeItem(LEGACY_ENTRIES);
    localStorage.removeItem(LEGACY_SEED);
    setStatus('ok', '브라우저에 있던 기록 ' + old.length + '개월을 기타/tracker_data.json으로 옮겼습니다');
    return true;
  }

  async function initStorage() {
    setStatus('', '저장 위치 확인 중...');
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();

      entries = Array.isArray(data.entries) ? data.entries : [];
      // ⚠ 같이 읽어야 한다 — 안 읽으면 저장할 때 빈 목록을 보내서, 내가 지운 달이
      //   다음 자동 실행에 되살아난다
      autoSkip = Array.isArray(data.autoSkip) ? data.autoSkip : [];
      seed = (isFinite(data.seed) && data.seed > 0) ? data.seed : 3000;
      $('seedInput').value = seed;
      ready = true;
      setEnabled(true);

      // 파일이 비었을 때만 구버전 데이터를 본다. 파일에 기록이 있으면
      // 그게 원본이므로 브라우저 쪽은 쳐다보지 않는다
      if (entries.length > 0) {
        setStatus('ok', '기타/tracker_data.json에서 불러옴 (' + entries.length + '개월)');
      } else if (!await migrateLegacy()) {
        setStatus('ok', '기타/tracker_data.json에 저장됩니다');
      }
    } catch (e) {
      ready = false;
      entries = [];
      autoSkip = [];
      setEnabled(false);
      setStatus('err', '백엔드(3002)에 연결할 수 없습니다 — start.bat 실행 후 다시 시도하세요. 저장할 수 없어 입력을 막아둡니다', true);
    }
    refreshMonthInput();
    render();
  }

  // ── 계산 ───────────────────────────────────────────────────────────────────
  // 입금은 **거래로 번 돈이 아니다** (2026-09-26 사용자 요청으로 추가) — 외부에서 가져와
  // 넣은 돈이므로 수익에서 빼고, 원금에 더한다. 출금은 반대로 번 돈이라 수익에 더한다.
  //
  // ⚠ 월 수익률의 분모는 **전달 잔고 + 이번달 입금**이다 (2026-09-26 사용자가 고른 안).
  //   전달 잔고만으로 나누지 말 것 — 입금액은 기존 잔고보다 클 수 있어서, 못 번 수익률이
  //   크게 부풀어 보인다. 실례: 전달 1,000 → 10,000 입금 → 100 벌었다.
  //     분모에 입금을 넣으면 100/11,000 = +0.91%  (지금 이것)
  //     전달 잔고만 쓰면    100/1,000  = +10.00% (실제로 못 번 수익률이다)
  //   출금이 분모를 안 건드리는 것과 다른 이유: 출금은 잔고보다 커질 수 없어 왜곡이 작다.
  //
  // ※ 입금이 0이면 아래 세 식은 **입금 기능이 없던 때의 식과 완전히 같다.**
  //   그래서 옛 기록의 숫자는 하나도 바뀌지 않는다
  function computeRows(s) {
    let cumWithdrawal = 0, cumDeposit = 0;
    return entries.map((e, i) => {
      const deposit    = e.deposit || 0;
      const withdrawal = e.withdrawal || 0;
      const prevAsset  = i === 0 ? s : entries[i - 1].asset;
      // 수익 = 잔고 + 이번달 출금 − 이번달 입금 − 전달 잔고
      const profit = e.asset + withdrawal - deposit - prevAsset;
      // 그 달에 굴린 돈 = 전달 잔고 + 이번달 입금 (위 주석의 이유)
      const base = prevAsset + deposit;
      const monthRate = base > 0 ? (profit / base) * 100 : 0;
      cumDeposit    += deposit;
      cumWithdrawal += withdrawal;
      // 투입 원금 = 시드머니 + 누적 입금 / 지금 가치 = 잔고 + 누적 출금
      const principal      = s + cumDeposit;
      const effectiveAsset = e.asset + cumWithdrawal;
      // 누적 수익금 = 지금 가치 − 투입 원금. **누적 수익률의 분자와 같은 값이다** —
      // 한 줄에서 같이 뽑으므로 표시된 금액과 %가 갈릴 수 없다
      const cumProfit = effectiveAsset - principal;
      const cumRate = principal > 0 ? cumProfit / principal * 100 : 0;
      return { month: e.month, auto: e.auto === true, profit, asset: e.asset, deposit, withdrawal,
               cumDeposit, cumWithdrawal, principal, effectiveAsset, cumProfit, monthRate, cumRate };
    });
  }

  function render() {
    const s = getSeed();
    const rows = computeRows(s);

    // 요약
    const last = rows.length > 0 ? rows[rows.length - 1] : null;
    const curAsset = last ? last.asset : s;
    // 투입 원금 = 첫 시드머니 + 누적 입금. **누적 수익률·수익금의 분모와 같은 값**이라
    // computeRows에서 그대로 꺼낸다 (여기서 다시 더하면 두 곳이 갈릴 수 있다).
    // ⚠ 기록이 하나도 없으면 아직 입금이 없으니 첫 시드머니가 곧 투입 원금이다
    const principal = last ? last.principal : s;
    const cumDeposit = last ? last.cumDeposit : 0;
    const cumWithdrawal = last ? last.cumWithdrawal : 0;
    const cumRate = last ? last.cumRate : 0;
    const cumProfit = last ? last.cumProfit : 0;

    $('sumPrincipal').textContent = '$' + fmt(principal);
    $('sumAsset').textContent = '$' + fmt(curAsset);
    $('sumDeposit').textContent = cumDeposit > 0 ? '$' + fmt(cumDeposit) : '$0';
    $('sumWithdraw').textContent = cumWithdrawal > 0 ? '$' + fmt(cumWithdrawal) : '$0';

    const rateEl = $('sumRate');
    rateEl.textContent = (cumRate >= 0 ? '+' : '') + cumRate.toFixed(2) + '%';
    rateEl.className = 'value ' + (cumRate >= 0 ? 'green' : 'red');

    // 금액은 수익률과 **같은 부호·같은 색**이어야 한다 (둘이 같은 값에서 나온다)
    const profitEl = $('sumProfit');
    profitEl.textContent = (cumProfit >= 0 ? '+$' : '-$') + fmtDec(Math.abs(cumProfit));
    profitEl.className = 'value ' + (cumProfit >= 0 ? 'green' : 'red');

    const hasRows = rows.length > 0;
    $('resultsCard').style.display = hasRows ? '' : 'none';
    $('emptyCard').style.display = hasRows ? 'none' : '';

    if (!hasRows) return;

    // 차트 — 실현 자산(잔고+누적출금) 기준으로 표시
    const chart = $('chart');
    chart.innerHTML = '';
    const effectiveVals = rows.map(r => r.effectiveAsset);
    const maxVal = Math.max(...effectiveVals);
    const minVal = Math.min(...effectiveVals);
    const range = maxVal - minVal || 1;

    rows.forEach(r => {
      const pct = ((r.effectiveAsset - minVal) / range) * 80 + 10;
      const col = document.createElement('div');
      col.className = 'bar-col';
      col.innerHTML = `
        <div class="bar-val">$${fmt(r.effectiveAsset)}</div>
        <div class="bar pos" style="height:${pct}%"></div>
        <div class="bar-label">${r.month.slice(5)}월</div>
      `;
      chart.appendChild(col);
    });

    // 입금·출금 열: 각각 한 건이라도 있으면 표시
    const hasDeposit    = rows.some(r => r.deposit > 0);
    const hasWithdrawal = rows.some(r => r.withdrawal > 0);

    // 테이블
    $('tableBody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${r.month}${r.auto ? '<span class="auto-tag">자동</span>' : ''}</td>
        <td class="${r.profit >= 0 ? 'profit' : 'loss'}">${r.profit >= 0 ? '+' : ''}$${fmtDec(r.profit)}</td>
        <td>$${fmt(r.asset)}</td>
        ${hasDeposit ? `<td class="${r.deposit > 0 ? 'profit' : ''}">${r.deposit > 0 ? '+$' + fmt(r.deposit) : '-'}</td>` : ''}
        ${hasWithdrawal ? `<td class="${r.withdrawal > 0 ? 'loss' : ''}">${r.withdrawal > 0 ? '-$' + fmt(r.withdrawal) : '-'}</td>` : ''}
        <td class="${r.monthRate >= 0 ? 'profit' : 'loss'}">${r.monthRate >= 0 ? '+' : ''}${r.monthRate.toFixed(2)}%</td>
        <td class="cumrate ${r.cumRate >= 0 ? 'pos' : 'neg'}">${r.cumRate >= 0 ? '+' : ''}${r.cumRate.toFixed(2)}%</td>
        <td class="cumrate ${r.cumProfit >= 0 ? 'pos' : 'neg'}">${r.cumProfit >= 0 ? '+$' : '-$'}${fmtDec(Math.abs(r.cumProfit))}</td>
        <td><button class="btn-del" onclick="deleteEntry(${i})" title="삭제">×</button></td>
      </tr>
    `).join('');

    // 본문 열에 맞춰 헤더도 토글 — **id로 집는다.** 자리(nth-child)로 세면 열이 늘 때 어긋난다
    $('thDeposit').style.display  = hasDeposit    ? '' : 'none';
    $('thWithdraw').style.display = hasWithdrawal ? '' : 'none';
  }

  $('seedInput').addEventListener('input', () => { save(); render(); });
  $('btnRetry').addEventListener('click', initStorage);

  // 파일을 읽기 전까지는 잠가 둔다
  setEnabled(false);
  initStorage();
</script>
</body>
</html>
